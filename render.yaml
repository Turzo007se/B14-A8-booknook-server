services:
  - type: web
    name: booknook-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: booknook
      - key: BETTER_AUTH_URL
        sync: false
      - key: CLIENT_URL
        sync: false
